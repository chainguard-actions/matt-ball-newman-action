name: Test Newman iteration count
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run Newman with iteration count
        uses: .
        with:
          collection: tests/fixtures/simple-collection.json
          iterationCount: '2'
          reporters: '["cli"]'

      - name: Assert action completed successfully with multiple iterations
        run: |
          echo "Newman action completed with iterationCount=2 without error"
          echo "PASS"
