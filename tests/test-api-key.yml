name: Test Newman with apiKey input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run Newman with apiKey and local collection
        uses: .
        with:
          collection: tests/fixtures/simple-collection.json
          apiKey: 'PMAK-test-key-not-real'
          reporters: '["cli"]'

      - name: Assert action completed with apiKey input
        run: |
          echo "Newman action completed with apiKey input without error"
          echo "PASS"
