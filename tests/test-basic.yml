name: Test basic Newman collection run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run Newman with simple collection
        uses: .
        with:
          collection: tests/fixtures/simple-collection.json
          reporters: '["cli"]'

      - name: Assert action completed successfully
        run: |
          echo "Newman action completed without error"
          echo "PASS"
