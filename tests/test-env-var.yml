name: Test Newman with environment variables
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run Newman with envVar input
        uses: .
        with:
          collection: tests/fixtures/simple-collection.json
          envVar: '[{"key":"TEST_VAR","value":"hello"}]'
          reporters: '["cli"]'

      - name: Assert action completed successfully with env vars
        run: |
          echo "Newman action completed with envVar input without error"
          echo "PASS"
