name: Test Newman with reporter and color options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run Newman with reporter options and color setting
        uses: .
        with:
          collection: tests/fixtures/simple-collection.json
          reporters: '["cli"]'
          reporter: '{"cli":{"noSummary":false}}'
          color: 'off'

      - name: Assert action completed successfully with reporter options
        run: |
          echo "Newman action completed with reporter and color options without error"
          echo "PASS"
