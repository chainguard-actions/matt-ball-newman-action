name: Test Newman with iteration data file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run Newman with iteration data CSV
        uses: .
        with:
          collection: tests/fixtures/simple-collection.json
          iterationData: tests/fixtures/iteration-data.csv
          reporters: '["cli"]'

      - name: Assert action completed successfully with iteration data
        run: |
          echo "Newman action completed with iterationData without error"
          echo "PASS"
