name: Test Newman with globals and globalVar
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run Newman with globals file and globalVar input
        uses: .
        with:
          collection: tests/fixtures/simple-collection.json
          globals: tests/fixtures/test-globals.json
          globalVar: '[{"key":"EXTRA_GLOBAL","value":"extra-value"}]'
          reporters: '["cli"]'

      - name: Assert action completed successfully with globals
        run: |
          echo "Newman action completed with globals and globalVar without error"
          echo "PASS"
