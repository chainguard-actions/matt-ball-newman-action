name: Test Newman with environment file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run Newman with environment file
        uses: .
        with:
          collection: tests/fixtures/simple-collection.json
          environment: tests/fixtures/test-environment.json
          reporters: '["cli"]'

      - name: Assert action completed successfully with environment
        run: |
          echo "Newman action completed with environment file without error"
          echo "PASS"
