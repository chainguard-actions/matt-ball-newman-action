name: Test Newman with advanced options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy cookie jar file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/cookies"
          # Create a minimal tough-cookie compatible JSON cookie jar
          echo '{"version":"tough-cookie@4.1.3","storeType":"MemoryCookieStore","rejectPublicSuffixes":true,"enableLooseMode":false,"allowSpecialUseDomain":true,"cookies":[]}' \
            > "$GITHUB_WORKSPACE/tests/fixtures/cookies/cookiejar.json"

      - id: action
        name: Run Newman with cookieJar and requestAgents options
        uses: .
        continue-on-error: true
        with:
          collection: tests/fixtures/simple-collection.json
          cookieJar: tests/fixtures/cookies/cookiejar.json
          requestAgents: '{}'
          reporters: '["cli"]'

      - name: Assert action ran with advanced options
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: Newman ran successfully with advanced options"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: Newman ran with advanced options (failed gracefully)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
